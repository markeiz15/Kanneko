<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Provador de Canecas</title>
<link rel="icon" href="kanneko-logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Tela de entrada do Provador: um cartão centralizado com a logo e o campo de senha. */
:root{
  --bg:#E7EAEE; --card:#FFFFFF; --fg:#15171C; --muted:#5A6170; --line:#D4D8DF;
  --accent:#AE1460; --accent-ink:#FFFFFF; --bad:#B42318;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-ui:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0F1115; --card:#181B21; --fg:#ECEEF2; --muted:#9AA2B0; --line:#2A2E37; --accent:#F0579F; --accent-ink:#1C0712; --bad:#F2766B; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0F1115; --card:#181B21; --fg:#ECEEF2; --muted:#9AA2B0; --line:#2A2E37; --accent:#F0579F; --accent-ink:#1C0712; --bad:#F2766B; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-ui)}
.card{width:min(380px,100%);display:grid;gap:16px;padding:28px 24px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 20px 50px -28px rgba(0,0,0,.5)}
.logo{width:72px;height:72px;border-radius:50%;background:#FFFFFF;box-shadow:0 0 0 1px var(--line);justify-self:center}
h1{margin:0;text-align:center;font:700 22px/1.15 var(--font-display);letter-spacing:-.01em}
p{margin:0;text-align:center;color:var(--muted);font-size:14px}
label{display:grid;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
input[type=password]{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--fg);cursor:pointer}
.check input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
button{min-height:46px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 15px var(--font-ui);cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
.erro{color:var(--bad);font-weight:500;min-height:1.4em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <img class="logo" src="kanneko-logo.png" alt="KANNEKO">
  <h1>Provador de Canecas</h1>
  <p>Área da KANNEKO. Digite a senha para entrar.</p>
  <label>Senha<input type="password" id="senha" autocomplete="current-password" required></label>
  <label class="check"><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
  <button type="submit" id="entrar">Entrar</button>
  <p class="erro" id="erro" role="alert"></p>
</form>

  const LEMBRAR = 'provador:acesso';
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const $ = (id) => document.getElementById(id);

  // Abre o Provador: decifra a página inteira e troca este documento por ela.
  // Só troca depois que esta página terminou de carregar; antes disso o navegador
  // ignora o document.open() e o Provador acaba colado embaixo da tela de senha.
  const carregada = document.readyState === 'complete' ? Promise.resolve() : new Promise((ok) => window.addEventListener('load', ok, { once: true }));
  async function abrir(chaveBruta) {
    const k = await crypto.subtle.importKey('raw', chaveBruta, 'AES-GCM', false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.iv) }, k, b64(D.ct)));
    await carregada;
    document.open(); document.write(html); document.close();
  }
  async function desembrulhar(senha) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(D.salt), iterations: D.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.wiv) }, kek, b64(D.wrapped)));
  }

  (async () => {
    let salva = null;
    try { salva = localStorage.getItem(LEMBRAR); } catch (e) { /* sem armazenamento */ }
    if (salva) {
      try { await abrir(b64(salva)); return; }
      catch (e) { try { localStorage.removeItem(LEMBRAR); } catch (_) { /* nada */ } }
    }
    $('senha').focus();
  })();

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('entrar'); btn.disabled = true; btn.textContent = 'Conferindo…'; $('erro').textContent = '';
    let chave;
    try { chave = await desembrulhar($('senha').value); }
    catch (err) {
      $('erro').textContent = 'Senha incorreta. Confira e tente de novo.';
      btn.disabled = false; btn.textContent = 'Entrar'; $('senha').select(); return;
    }
    if ($('lembrar').checked) { try { localStorage.setItem(LEMBRAR, btoa(String.fromCharCode.apply(null, chave))); } catch (_) { /* nada */ } }
    await abrir(chave);
  });
})();
